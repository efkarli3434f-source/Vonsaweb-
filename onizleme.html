<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EJDER Studio · Görünüm kontrolü</title>
<style>*{box-sizing:border-box}body{margin:0;background:#160c12;color:#f6e1bb;font:16px system-ui;text-align:center}header{padding:12px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}select{font:inherit;background:#321620;color:inherit;border:1px solid #b28b56;border-radius:8px;padding:8px;text-align:center}a{color:inherit}main{overflow:auto;padding:8px}iframe{display:block;margin:auto;height:760px;width:390px;border:1px solid #caa065;border-radius:12px;background:#190d13}label{display:flex;gap:8px;align-items:center}</style></head><body>
<header><a href="./">EJDER Studio</a><label>Görünüm<select id="size"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="768">768 px</option><option value="1363">1363 px</option></select></label><label>Dil<select id="lang"><option value="tr">TR</option><option value="de">DE</option></select></label><label>Sayfa<select id="page"><option value="">Ana sayfa</option><option value="campaigns">İlham</option><option value="products">Ürünler</option><option value="cases">Kılıflar</option><option value="collection/case-mug">Kılıf ve kupa</option><option value="collection/shirt-keychain">Tişört ve anahtarlık</option><option value="collection/hoodie-tote">Hoodie ve çanta</option><option value="collection/poster-gift">Poster ve kutu</option><option value="templates">Şablonlar</option><option value="saved">Tasarımlarım</option><option value="account">Hesabım</option><option value="payments">Ödeme</option><option value="about">Hakkımızda</option><option value="contact">İletişim</option><option value="privacy">Gizlilik</option><option value="legal">Yasal bilgiler</option><option value="studio/shirt">Tişört stüdyosu</option><option value="studio/mug">Kupa stüdyosu</option><option value="studio/case-s24">Kılıf stüdyosu</option><option value="netlestir.html">Snapshot</option></select></label></header><main><iframe id="site" title="EJDER Studio sayfa görünümü" src="./?preview=1#/"></iframe></main>
<script>(()=>{const frame=document.getElementById('site'),size=document.getElementById('size'),lang=document.getElementById('lang'),page=document.getElementById('page');size.onchange=()=>{frame.style.width=size.value+'px'};function open(){frame.src=page.value==='netlestir.html'?'netlestir.html':(lang.value==='de'?'de.html':'./')+'?preview=1#/'+page.value}lang.onchange=page.onchange=open;})();</script></body></html>
